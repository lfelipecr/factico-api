<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fáctico Middleware API — Documentación</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css"
    />
    <style>
      html {
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
      }
      .topbar {
        background: #0f3d5c;
        color: #fff;
        padding: 12px 24px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      .topbar a {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <strong>Fáctico Middleware API</strong> — JSON REST para integradores (ERP/POS).
      Referencia Odoo directa:
      <a href="https://lfelipecr.github.io/apifecrdoc/" target="_blank" rel="noopener"
        >API Fáctico Odoo (form-data)</a
      >
    </div>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
      window.onload = function () {
        window.ui = SwaggerUIBundle({
          url: "./openapi-specification.json",
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: "StandaloneLayout",
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 2,
          docExpansion: "list",
          tryItOutEnabled: true,
        });
      };
    </script>
  </body>
</html>
